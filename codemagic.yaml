workflows:
  ios-swiftpm-build:
    name: iOS SwiftPM Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      xcode: latest
    scripts:
      - name: Build Swift Playgrounds App
        script: |
          # Projenin olduğu dizine git
          PACKAGE_DIR=$(find . -name "Package.swift" -exec dirname {} \;)
          cd "$PACKAGE_DIR"
          
          # Swift Playgrounds uygulamasını iOS için derle
          xcodebuild \
            -scheme "$(basename "$PWD")" \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath build \
            build
    artifacts:
      - /**/build/Build/Products/Release-iphoneos/*.app
      - /**/build/Build/Products/Release-iphoneos/*.ipa
