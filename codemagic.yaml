workflows:
  ios-swiftpm-build:
    name: iOS SwiftPM Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      xcode: latest
    scripts:
      - name: Build Swift Playgrounds Package
        script: |
          # 1. Swift Playgrounds klasörüne geç
          PACKAGE_DIR=$(find . -name "Package.swift" -exec dirname {} \;)
          cd "$PACKAGE_DIR"
          
          # 2. Üretilecek Xcode Projesini Otomatik Oluştur
          swift package generate-xcodeproj
          
          # 3. Oluşan Projedeki Şema İsmini Otomatik Tespit Et
          SCHEME_NAME=$(xcodebuild -list | grep -A 5 "Schemes:" | tail -n +2 | xargs | awk '{print $1}')
          
          # 4. Derlemeyi Başlat
          xcodebuild build \
            -project *.xcodeproj \
            -scheme "$SCHEME_NAME" \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath build
    artifacts:
      - /**/build/Build/Products/Release-iphoneos/*.app
      - /**/build/Build/Products/Release-iphoneos/*.ipa
