workflows:
  ios-swiftpm-build:
    name: iOS SwiftPM Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      xcode: latest
    scripts:
      - name: List Schemes and Build
        script: |
          # Projedeki gerçek Şema (Scheme) isimlerini loga yazdır
          xcodebuild -list
          
          # Swift Package projesini derle
          xcodebuild build \
            -scheme "Hatirlataci HU" \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath build
    artifacts:
      - /**/build/Build/Products/Release-iphoneos/*.app
      - /**/build/Build/Products/Release-iphoneos/*.ipa
