workflows:
  ios-swiftpm-build:
    name: iOS SwiftPM Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      xcode: latest
    scripts:
      - name: Build Swift PM App and Create IPA
        script: |
          set -e
          
          # 1. Package.swift klasörüne git
          PACKAGE_DIR=$(find . -name "Package.swift" -exec dirname {} \;)
          cd "$PACKAGE_DIR"
          
          # 2. Doğrudan Swift Package üzerinden iOS derlemesi yap
          swift build -c release --triple arm64-apple-ios16.0-simulator
          
          # 3. xcodebuild ile bağımsız executable çıktısı al
          xcodebuild build \
            -scheme "$(xcodebuild -list | grep -A 5 "Schemes:" | tail -n +2 | xargs | awk '{print $1}')" \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath build

          # 4. Derlenen .app paketini doğrula ve IPA üret
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "HATA: .app klasörü bulunamadı!"
            exit 1
          fi

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          
          # IPA sıkıştırmasını gerçekleştir
          zip -r Hatirlatici.ipa Payload
          
          mkdir -p $CM_BUILD_DIR/output
          cp Hatirlatici.ipa $CM_BUILD_DIR/output/
    artifacts:
      - output/*.ipa
