workflows:
  ios-swiftpm-build:
    name: iOS SwiftPM Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      xcode: latest
    scripts:
      - name: Convert and Build SwiftPM App
        script: |
          # 1. Package.swift dosyasının olduğu dizine git
          PACKAGE_DIR=$(find . -name "Package.swift" -exec dirname {} \;)
          cd "$PACKAGE_DIR"
          
          # 2. Swift Playgrounds paketini Xcode Projesine dönüştür
          swift package generate-xcodeproj
          
          # 3. Otomatik oluşan xcodeproj ile iOS derlemesini başlat
          PROJ_FILE=$(ls -d *.xcodeproj | head -n 1)
          
          xcodebuild build \
            -project "$PROJ_FILE" \
            -scheme "${PROJ_FILE%.xcodeproj}" \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath build
    artifacts:
      - /**/build/Build/Products/Release-iphoneos/*.app
      - /**/build/Build/Products/Release-iphoneos/*.ipa
