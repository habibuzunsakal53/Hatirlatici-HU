workflows:
  ios-swiftpm-build:
    name: iOS SwiftPM Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      xcode: latest
    scripts:
      - name: Build Swift Playgrounds App
        script: |
          # 1. Package.swift dosyasının olduğu klasöre gir
          cd "$(dirname "$(find . -name "Package.swift" | head -n 1)")"
          
          # 2. Doğrudan paket ismiyle iOS derlemesini başlat
          xcodebuild build \
            -scheme "Hatirlataci HU" \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath build
    artifacts:
      - /**/build/Build/Products/Release-iphoneos/*.app
