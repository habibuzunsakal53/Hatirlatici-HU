workflows:
  ios-swiftpm-build:
    name: iOS SwiftPM Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      xcode: latest
    scripts:
      - name: Build Swift Playgrounds App
        script: |
          # 1. Swift Playgrounds proje dizinini bul
          PACKAGE_DIR=$(find . -name "Package.swift" -exec dirname {} \;)
          cd "$PACKAGE_DIR"
          
          # 2. Klasör adını al
          APP_NAME=$(basename "$PWD")
          
          # 3. iOS SDK kullanarak doğrudan Swift Playgrounds paketini derle
          xcodebuild build \
            -scheme "$APP_NAME" \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath build
    artifacts:
      - /**/build/Build/Products/Release-iphoneos/*.app
      - /**/build/Build/Products/Release-iphoneos/*.ipa
